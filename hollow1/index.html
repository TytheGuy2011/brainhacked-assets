<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="UTF-8">

<title>Hollow Knight</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">
<meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#loading-text{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:#fff;
    font-size:24px;
    z-index:1000;
}

#unity-canvas{
    width:100vw;
    height:100vh;
    display:block;
    background:#000;
}

.btn{
    position:fixed;
    top:12px;
    padding:10px 18px;
    cursor:pointer;
    background:rgba(50,50,50,.85);
    color:#fff;
    border:1px solid rgba(255,255,255,.2);
    border-radius:6px;
    font-size:14px;
    z-index:9999;
    transition:.2s;
}

.btn:hover{
    background:rgba(70,70,70,.95);
}

#fps-graph{
    position:fixed;
    top:12px;
    left:12px;
    width:200px;
    height:70px;
    background:rgba(0,0,0,.8);
    border-radius:6px;
    padding:10px;
    z-index:9999;
}

#fps-canvas{
    width:100%;
    height:100%;
    display:block;
}

</style>
</head>

<body>

<div id="loading-text">
Preparing game...
</div>

<canvas id="unity-canvas"></canvas>

<div id="fps-graph">
    <canvas id="fps-canvas" width="180" height="50"></canvas>
</div>

<script>

const loadingText =
    document.getElementById("loading-text");

const canvas =
    document.getElementById("unity-canvas");

const fpsCanvas =
    document.getElementById("fps-canvas");

const ctx =
    fpsCanvas.getContext("2d");

let fpsHistory = [];

const maxHistory = 90;

let lastFrameTime = performance.now();

let loadedBytes = 0;

const totalMB = "912.81";


function updateFPS(){

    const now = performance.now();

    const delta =
        (now - lastFrameTime) / 1000;

    lastFrameTime = now;

    const fps =
        delta > 0 ? 1 / delta : 60;

    fpsHistory.push(fps);

    if(fpsHistory.length > maxHistory)
        fpsHistory.shift();

    ctx.clearRect(0,0,180,50);

    for(let i=0;i<fpsHistory.length;i++){

        const f = fpsHistory[i];

        const h =
            Math.min(f / 60, 1) * 35;

        ctx.fillStyle =
            f > 50 ? "#0f0" :
            f > 30 ? "#fa0" :
                     "#f33";

        ctx.fillRect(
            i * 2,
            50 - h,
            1.8,
            h
        );
    }

    ctx.fillStyle = "#fff";

    ctx.font =
        "bold 13px monospace";

    ctx.fillText(
        Math.round(fps) + " FPS",
        6,
        16
    );

    requestAnimationFrame(updateFPS);
}


async function fetchWithProgress(url){

    const response = await fetch(url);

    const reader =
        response.body.getReader();

    const chunks = [];

    while(true){

        const {done,value} =
            await reader.read();

        if(done)
            break;

        loadedBytes += value.length;

        chunks.push(value);

        loadingText.textContent =
            `${(loadedBytes/1048576).toFixed(2)} MB / ${totalMB} MB`;
    }

    return new Blob(chunks);
}


function generateParts(base,start,end){

    return Array.from(
        {length:end-start+1},
        (_,i)=>`${base}.part${start+i}`
    );
}


async function getCachedOrMerge(
    cacheName,
    parts
){

    const cache =
        await caches.open("hk-cache-v1");

    const cached =
        await cache.match(cacheName);

    if(cached){

        loadingText.textContent =
            `Loaded ${cacheName} from cache`;

        const blob =
            await cached.blob();

        return URL.createObjectURL(blob);
    }

    const blobs =
        await Promise.all(
            parts.map(fetchWithProgress)
        );

    const mergedBlob =
        new Blob(blobs);

    await cache.put(
        cacheName,
        new Response(mergedBlob)
    );

    const wasmBlob = new Blob(
    [mergedBlob],
    {type:"application/wasm"}
);

return URL.createObjectURL(
    wasmBlob
);
}


(async()=>{

    const dataUrl =
        await getCachedOrMerge(
            "hktruffled.data",
            generateParts(
                "Build/hktruffled.data",
                1,
                45
            )
        );

    const wasmUrl =
        await getCachedOrMerge(
            "hktruffled.wasm",
            generateParts(
                "Build/hktruffled.wasm",
                1,
                2
            )
        );

    const script =
        document.createElement("script");

    script.src =
        "Build/hktruffled.loader.js";

    script.onload = ()=>{

        createUnityInstance(
            canvas,
            {
                dataUrl:dataUrl,
                frameworkUrl:
                    "Build/hktruffled.framework.js",
                codeUrl:wasmUrl,
                streamingAssetsUrl:
                    "StreamingAssets",
                companyName:
                    "Team Cherry",
                productName:
                    "Hollow Knight",
                productVersion:
                    "1.0",
                memory:
                    384 * 1024 * 1024,
                useWebGL2:true
            }
        )
        .then(()=>{

            loadingText.remove();

            addButtons();

            updateFPS();

        })
        .catch(alert);
    };

    document.body.appendChild(script);

})();


function addButtons(){

    const downloadBtn =
        document.createElement("button");

    downloadBtn.className = "btn";

    downloadBtn.style.right = "12px";

    downloadBtn.textContent =
        "Download Save";

    downloadBtn.onclick =
        exportSave;

    document.body.appendChild(
        downloadBtn
    );

    const importBtn =
        document.createElement("button");

    importBtn.className = "btn";

    importBtn.style.right = "170px";

    importBtn.textContent =
        "Import Save";

    importBtn.onclick =
        ()=>fileInput.click();

    document.body.appendChild(
        importBtn
    );
}



async function exportSave(){

    const req =
        indexedDB.open("/idbfs");

    req.onsuccess = e=>{

        const db =
            e.target.result;

        const tx =
            db.transaction(
                "FILE_DATA",
                "readonly"
            );

        const store =
            tx.objectStore(
                "FILE_DATA"
            );

        const valuesReq =
            store.getAll();

        const keysReq =
            store.getAllKeys();

        valuesReq.onsuccess =
        ()=>keysReq.onsuccess =
        ()=>{

            let saveEntry =
                null;

            for(
                let i = 0;
                i < keysReq.result.length;
                i++
            ){

                const key =
                    keysReq.result[i];

                if(
                    key.endsWith(
                        "/user1.dat"
                    )
                ){

                    saveEntry =
                        valuesReq.result[i];

                    break;
                }
            }

            if(!saveEntry){

                alert(
                    "No save found."
                );

                return;
            }

            let contents =
                saveEntry.contents;

            // Convert object -> Uint8Array
            if(
                typeof contents === "object" &&
                !(contents instanceof Uint8Array) &&
                !(contents instanceof Int8Array)
            ){

                const indexes =
                    Object.keys(contents)
                    .map(Number)
                    .sort((a,b)=>a-b);

                const arr =
                    new Uint8Array(
                        indexes.length
                    );

                indexes.forEach(i=>{

                    let v =
                        contents[i];

                    // Fix signed bytes
                    if(v < 0)
                        v += 256;

                    arr[i] = v;
                });

                contents = arr;
            }

            // Convert Int8Array -> Uint8Array
            if(
                contents instanceof Int8Array
            ){

                contents =
                    new Uint8Array(
                        contents.buffer
                    );
            }

            const blob =
                new Blob(
                    [contents],
                    {
                        type:
                        "application/octet-stream"
                    }
                );

            const url =
                URL.createObjectURL(
                    blob
                );

            const a =
                document.createElement(
                    "a"
                );

            a.href = url;

            a.download =
                "user1.dat";

            document.body.appendChild(
                a
            );

            a.click();

            a.remove();

            setTimeout(
                ()=>URL.revokeObjectURL(url),
                1000
            );
        };
    };

    req.onerror =
    ()=>{

        alert(
            "Failed to open IndexedDB."
        );
    };
}



const fileInput =
    document.createElement(
        "input"
    );

fileInput.type = "file";

fileInput.accept = ".dat";

fileInput.style.display =
    "none";

document.body.appendChild(
    fileInput
);



fileInput.onchange =
async ()=>{

    const file =
        fileInput.files[0];

    if(!file)
        return;

    try{

        const arrayBuffer =
            await file.arrayBuffer();

        const contents =
            new Uint8Array(
                arrayBuffer
            );

        const req =
            indexedDB.open(
                "/idbfs"
            );

        req.onsuccess = e=>{

            const db =
                e.target.result;

            const tx =
                db.transaction(
                    "FILE_DATA",
                    "readwrite"
                );

            const store =
                tx.objectStore(
                    "FILE_DATA"
                );

            store.getAllKeys()
            .onsuccess = ev=>{

                const keys =
                    ev.target.result;

                if(
                    !keys.length
                ){

                    alert(
                        "Open the game once and create a save first."
                    );

                    return;
                }

                let baseKey =
                    keys.find(
                        k=>
                        k.endsWith(
                            "/user1.dat"
                        )
                    );

                if(!baseKey){

                    baseKey =
                        keys[0];
                }

                const parts =
                    baseKey.split(
                        "/"
                    );

                const hash =
                    parts[2];

                const newKey =
                    `/idbfs/${hash}/user1.dat`;

                store.put(
                {
                    timestamp:
                        new Date(),

                    mode:33206,

                    contents
                },
                newKey);

                tx.oncomplete =
                ()=>{

                    alert(
                        "Save imported successfully.\nRefresh page."
                    );
                };
            };
        };

        req.onerror =
        ()=>{

            alert(
                "Failed to open IndexedDB."
            );
        };

    }catch(err){

        alert(
            "Import failed:\n" +
            err
        );
    }
};
</script>

</body>
</html>
